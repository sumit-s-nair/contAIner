[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mylib"
version = "0.1.0"
description = "A clean Python library fixture"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "requests>=2.28.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
]
