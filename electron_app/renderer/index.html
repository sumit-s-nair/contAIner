<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src http://localhost:5050; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;" />
  <title>contAIner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- macOS-style title bar -->
  <div id="titlebar">
    <div id="titlebar-dots">
      <span class="dot dot-red"   id="btn-close"></span>
      <span class="dot dot-amber" id="btn-min"></span>
      <span class="dot dot-green" id="btn-max"></span>
    </div>
    <span id="titlebar-name">contAIner</span>
    <div id="status-badge">
      <span id="status-dot" class="status-dot loading"></span>
      <span id="status-text">loading</span>
    </div>
  </div>

  <!-- Chat area -->
  <div id="app">
    <div id="chat-history" aria-live="polite" aria-label="Chat history"></div>

    <!-- Input bar -->
    <div id="input-area">
      <div id="input-row">
        <textarea
          id="user-input"
          rows="1"
          placeholder="describe what you need..."
          aria-label="User prompt"
          autocomplete="off"
        ></textarea>
        <button id="stop-btn" aria-label="Stop" style="display:none;">
          <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14">
            <rect x="3" y="3" width="10" height="10" rx="2"/>
          </svg>
        </button>
        <button id="send-btn" aria-label="Send">
          <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14">
            <path d="M14.293 8.707a1 1 0 000-1.414L9 2l-1.414 1.414L11.172 7H2v2h9.172l-3.586 3.586L9 14l5.293-5.293z"/>
          </svg>
        </button>
      </div>
      <div id="hints"><span>return send</span><span>shift+return newline</span></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
